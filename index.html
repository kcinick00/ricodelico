<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Arma tu sándwich</title>
<meta name="theme-color" content="#0F0F0F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0F0F;
    --bg-soft: #1A1A1A;
    --card: #1A1A1A;
    --card-hover: #222222;
    --border: #2A2A2A;
    --text: #FFFFFF;
    --text-muted: #A0A0A0;
    --accent: #B4FF39;
    --accent-dark: #8FD62E;
    --accent-glow: rgba(180, 255, 57, 0.4);
    --orange: #FF6B35;
    --red: #FF3B30;
    --blue: #60A5FA;

    --cat-pan: #F4A261;
    --cat-salsas: #E8B923;
    --cat-embutidos: #E5A5A5;
    --cat-proteinas: #8B4513;
    --cat-verduras: #4CAF50;

    --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  body.con-fondo::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -2;
    background-image: url('fondo-sandwich.jpg');
    background-size: cover;
    background-position: center;
    filter: brightness(0.65) saturate(1.15);
  }
  body.con-fondo::after {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    background: linear-gradient(180deg, rgba(15,15,15,0.6) 0%, rgba(15,15,15,0.8) 100%);
    pointer-events: none;
  }

  header {
    padding: 12px 20px 10px;
    background: rgba(15, 15, 15, 0.85);
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  header::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--orange) 100%);
  }
  header h1 {
    margin: 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 2px;
    line-height: 1;
    text-transform: uppercase;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 span { color: var(--accent); }
  header p {
    margin: 4px 0 0;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 500;
  }
  header p em {
    font-family: 'Caveat', cursive;
    font-style: normal;
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
  }

  .btn-volver {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .btn-volver:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .pantalla {
    display: none;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .pantalla.activa {
    display: flex;
    flex-direction: column;
  }

  /* ===== PANTALLA 1: CANTIDAD ===== */
  #pantalla-cantidad {
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }
  .cantidad-titulo {
    text-align: center;
    margin-bottom: 30px;
  }
  .cantidad-titulo h1 {
    margin: 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: 3px;
    line-height: 0.95;
    text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .cantidad-titulo h1 span { color: var(--accent); display: block; }
  .cantidad-titulo p {
    margin: 12px 0 0;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
  }
  .cantidad-titulo p em {
    font-family: 'Caveat', cursive;
    font-style: normal;
    color: var(--accent);
    font-size: 18px;
    font-weight: 700;
  }
  .cantidad-control {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 20px 36px;
    margin-bottom: 30px;
    box-shadow: var(--shadow-md);
  }
  .cantidad-control .btn-cant {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--accent);
    color: #0F0F0F;
    border: none;
    font-size: 34px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
  }
  .cantidad-control .btn-cant:hover { background: var(--accent-dark); }
  .cantidad-control .btn-cant:active { transform: scale(0.95); }
  .cantidad-control .numero-grande {
    font-family: 'JetBrains Mono', monospace;
    font-size: 64px;
    font-weight: 800;
    color: var(--accent);
    min-width: 100px;
    text-align: center;
    line-height: 1;
  }
  .btn-continuar {
    background: var(--accent);
    color: #0F0F0F;
    border: none;
    padding: 16px 44px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 3px;
    text-transform: uppercase;
    box-shadow: 0 8px 24px rgba(180, 255, 57, 0.3);
    transition: all 0.2s;
  }
  .btn-continuar:hover { background: var(--accent-dark); transform: translateY(-2px); }

  /* ===== PANTALLA 3: COMBOS ===== */
  #pantalla-combos {
    padding: 16px;
    overflow-y: auto;
  }
  .combos-titulo {
    text-align: center;
    margin-bottom: 16px;
  }
  .combos-titulo h2 {
    margin: 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text);
  }
  .combos-titulo h2 span { color: var(--accent); }
  .combos-titulo p {
    margin: 6px 0 0;
    color: var(--text-muted);
    font-size: 13px;
  }
  .combos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    max-width: 1400px;
    margin: 0 auto;
    padding-bottom: 20px;
  }
  .combo-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    transition: all 0.3s;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .combo-card:hover { border-color: var(--accent); transform: translateY(-4px); }
  .combo-emoji { font-size: 40px; line-height: 1; text-align: center; }
  .combo-nombre {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
  }
  .combo-ingredientes {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
    text-align: center;
    flex: 1;
    min-height: 40px;
  }
  .combo-precio {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    text-align: center;
    padding: 6px 0;
    border-top: 2px solid var(--border);
    margin-top: 4px;
  }
  .combo-agregar {
    background: var(--accent);
    color: #0F0F0F;
    border: none;
    padding: 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .combo-agregar:hover { background: var(--accent-dark); }

  /* ===== PANTALLA 4: ARMA SÁNDWICH ===== */
  #pantalla-sandwich {
    overflow: hidden;
  }
  
  /* ===== ESCRITORIO (3 columnas) ===== */
  .layout {
    display: grid;
    grid-template-columns: 1.8fr 1fr 1fr;
    gap: 12px;
    padding: 12px 14px;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
    min-height: 0;
  }

  .col-ingredientes {
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    background: transparent;
  }

  .col-resumen, .col-sandwich {
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ===== CELULAR (pestañas inferiores) ===== */
  @media (max-width: 900px) {
    .layout {
      display: block !important;
      padding: 10px;
      gap: 0;
      overflow: hidden;
    }
    
    /* Ocultar TODAS las columnas por defecto en móvil */
    .col-ingredientes,
    .col-resumen,
    .col-sandwich {
      display: none !important;
      width: 100%;
      height: 100%;
    }
    
    /* Mostrar SOLO la columna que tenga la clase movil-activa */
    .col-ingredientes.movil-activa {
      display: flex !important;
      flex-direction: column;
    }
    .col-resumen.movil-activa {
      display: flex !important;
      flex-direction: column;
      overflow-y: auto;
    }
    .col-sandwich.movil-activa {
      display: flex !important;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    
    /* Pestañas inferiores visibles solo en móvil */
    .movil-tabs {
      display: flex !important;
    }
  }
  
  @media (min-width: 901px) {
    .movil-tabs { display: none !important; }
  }

  /* Barra de pestañas horizontal (sticky) */
  .categorias-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 0 2px 8px 2px;
    margin-bottom: 6px;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
    scrollbar-width: none;
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(180deg, rgba(15,15,15,0.95) 70%, rgba(15,15,15,0) 100%);
  }
  .categorias-tabs::-webkit-scrollbar { display: none; }

  .categoria-tab {
    background: var(--card);
    border: 2px solid var(--border);
    color: var(--text-muted);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    transition: all 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.85;
  }
  .categoria-tab:hover {
    transform: translateY(-2px);
    opacity: 1;
  }

  .categoria-tab[data-cat="pan"] {
    border-color: var(--cat-pan);
    color: var(--cat-pan);
    background: rgba(244, 162, 97, 0.1);
  }
  .categoria-tab[data-cat="salsas"] {
    border-color: var(--cat-salsas);
    color: var(--cat-salsas);
    background: rgba(232, 185, 35, 0.15);
  }
  .categoria-tab[data-cat="embutidos"] {
    border-color: var(--cat-embutidos);
    color: var(--cat-embutidos);
    background: rgba(229, 165, 165, 0.1);
  }
  .categoria-tab[data-cat="proteinas"] {
    border-color: var(--cat-proteinas);
    color: var(--cat-proteinas);
    background: rgba(139, 69, 19, 0.15);
  }
  .categoria-tab[data-cat="verduras"] {
    border-color: var(--cat-verduras);
    color: var(--cat-verduras);
    background: rgba(76, 175, 80, 0.1);
  }

  .categoria-tab[data-cat="pan"].active {
    background: var(--cat-pan);
    border-color: var(--cat-pan);
    color: #0F0F0F;
    opacity: 1;
    box-shadow: 0 4px 12px rgba(244, 162, 97, 0.4);
  }
  .categoria-tab[data-cat="salsas"].active {
    background: var(--cat-salsas);
    border-color: var(--cat-salsas);
    color: #0F0F0F;
    opacity: 1;
    box-shadow: 0 4px 12px rgba(232, 185, 35, 0.4);
  }
  .categoria-tab[data-cat="embutidos"].active {
    background: var(--cat-embutidos);
    border-color: var(--cat-embutidos);
    color: #0F0F0F;
    opacity: 1;
    box-shadow: 0 4px 12px rgba(229, 165, 165, 0.4);
  }
  .categoria-tab[data-cat="proteinas"].active {
    background: var(--cat-proteinas);
    border-color: var(--cat-proteinas);
    color: #FFFFFF;
    opacity: 1;
    box-shadow: 0 4px 12px rgba(139, 69, 19, 0.4);
  }
  .categoria-tab[data-cat="verduras"].active {
    background: var(--cat-verduras);
    border-color: var(--cat-verduras);
    color: #FFFFFF;
    opacity: 1;
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
  }

  .categorias-contenido {
    flex: 1;
    overflow-y: auto;
    padding-right: 6px;
    min-height: 0;
    scroll-behavior: smooth;
  }
  .categorias-contenido::-webkit-scrollbar { width: 5px; }
  .categorias-contenido::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .categoria-section {
    margin-bottom: 16px;
    padding: 10px;
    border-radius: 12px;
    border-left: 4px solid var(--border);
    background: rgba(255,255,255,0.02);
    scroll-margin-top: 10px;
  }
  .categoria-section[data-cat="pan"] { border-left-color: var(--cat-pan); }
  .categoria-section[data-cat="salsas"] { border-left-color: var(--cat-salsas); }
  .categoria-section[data-cat="embutidos"] { border-left-color: var(--cat-embutidos); }
  .categoria-section[data-cat="proteinas"] { border-left-color: var(--cat-proteinas); }
  .categoria-section[data-cat="verduras"] { border-left-color: var(--cat-verduras); }

  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px;
  }
  .option {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    padding: 8px 6px 10px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .option:has(input:checked) {
    border-color: var(--accent);
    background: linear-gradient(180deg, rgba(180, 255, 57, 0.08) 0%, var(--card) 100%);
  }
  .option:has(input:checked)::after {
    content: "✓";
    position: absolute;
    top: 4px;
    right: 4px;
    width: 18px;
    height: 18px;
    background: var(--accent);
    color: #0F0F0F;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
  }
  .option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .option-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    object-fit: cover;
    background: var(--bg-soft);
  }
  .option-name { font-size: 11px; font-weight: 600; line-height: 1.2; color: var(--text); }
  .price { font-size: 11px; font-weight: 700; color: var(--accent); font-family: 'JetBrains Mono', monospace; }

  .qty-controls {
    display: none;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
    padding: 2px 4px;
    background: var(--bg);
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .qty-controls.visible { display: flex; }
  .qty-btn {
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #0F0F0F;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .qty-btn.qty-minus { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .qty-display {
    min-width: 16px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }

  .preview-card {
    background: linear-gradient(180deg, #1A1A1A 0%, #0F0F0F 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 8px 12px;
    box-shadow: var(--shadow-md);
    position: relative;
    overflow: hidden;
    flex: 1;
    width: 100%;
  }
  .preview-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--orange) 100%);
  }
  .preview-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  .preview-title::before, .preview-title::after {
    content: "";
    height: 1px;
    background: var(--accent);
    flex: 1;
    opacity: 0.3;
  }
  #sandwich-canvas {
    width: 100%;
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    flex: 1;
    object-fit: contain;
  }

  .summary-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 12px 14px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex: 1;
  }
  .summary-card h2 {
    margin: 0 0 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  #summary-list {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
    overflow-y: auto;
  }
  #summary-list li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  #summary-list li:last-child { border-bottom: none; }
  #summary-list li .item-name { color: var(--text); font-weight: 500; font-size: 13px; }
  #summary-list li .item-price {
    color: var(--accent);
    font-weight: 700;
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  #summary-list .empty-msg {
    color: var(--text-muted);
    font-size: 12px;
    padding: 12px 0;
    text-align: center;
    font-style: italic;
  }
  .subtotal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    margin-top: 6px;
    border-top: 2px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .subtotal-row span:last-child {
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
  }
  .clear-btn {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    flex-shrink: 0;
  }
  .clear-btn:active { transform: scale(0.98); }

  .barra-acciones-sandwich {
