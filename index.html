<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Arma tu sándwich</title>
<meta name="theme-color" content="#0F0F0F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0F0F;
    --bg-soft: #1A1A1A;
    --card: #1A1A1A;
    --card-hover: #222222;
    --border: #2A2A2A;
    --text: #FFFFFF;
    --text-muted: #A0A0A0;
    --accent: #B4FF39;
    --accent-dark: #8FD62E;
    --accent-glow: rgba(180, 255, 57, 0.4);
    --orange: #FF6B35;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }

  /* 👇 Altura dinámica para tablets y móviles */
  html, body {
    margin: 0;
    padding: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    position: relative;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ===== FONDO ===== */
  body.con-fondo::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -2;
    background-image: url('fondo-sandwich.jpg');
    background-size: cover;
    background-position: center;
    filter: brightness(0.65) saturate(1.15);
  }
  body.con-fondo::after {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1;
    background: linear-gradient(180deg, rgba(15,15,15,0.6) 0%, rgba(15,15,15,0.8) 100%);
    pointer-events: none;
  }

  /* ===== HEADER ===== */
  header {
    padding: 18px 24px 14px;
    background: rgba(15, 15, 15, 0.85);
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    z-index: 100;
  }
  header::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--orange) 100%);
  }
  header h1 {
    margin: 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    font-weight: 400;
    letter-spacing: 2px;
    line-height: 1;
    text-transform: uppercase;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 span { color: var(--accent); }
  header p {
    margin: 6px 0 0;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
  }
  header p em {
    font-family: 'Caveat', cursive;
    font-style: normal;
    color: var(--accent);
    font-size: 18px;
    font-weight: 700;
  }

  /* ===== LAYOUT ===== */
  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    padding: 14px 16px;
    max-width: 1600px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
    min-height: 0;
  }

  @media (min-width: 1100px) {
    .layout {
      grid-template-columns: 2fr 1fr 1fr;
      gap: 14px;
    }
    .col-ingredientes { order: 1; }
    .col-resumen { order: 2; }
    .col-sandwich { order: 3; }
  }

  @media (max-width: 1099px) {
    html, body { overflow: auto; height: auto; min-height: 100dvh; }
    body { min-height: 100dvh; display: block; }
    .layout { display: block; padding: 16px; }
    .col-sandwich { order: 1; margin-bottom: 16px; }
    .col-ingredientes { order: 2; margin-bottom: 16px; }
    .col-resumen { order: 3; }
  }

  /* ===== COLUMNA IZQUIERDA: INGREDIENTES ===== */
  .col-ingredientes {
    overflow-y: auto;
    padding-right: 8px;
    min-height: 0;
    height: 100%;
    -webkit-overflow-scrolling: touch;
  }
  .col-ingredientes::-webkit-scrollbar { width: 6px; }
  .col-ingredientes::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  @media (max-width: 1099px) {
    .col-ingredientes {
      overflow-y: visible;
      height: auto;
      padding-right: 0;
    }
  }

  .col-resumen,
  .col-sandwich {
    min-height: 0;
    height: 100%;
  }

  @media (max-width: 1099px) {
    .col-resumen, .col-sandwich { height: auto; }
  }

  /* ===== VISTA PREVIA (SÁNDWICH PEQUEÑO Y FIJO) ===== */
  .col-sandwich {
    max-width: 320px;
    width: 100%;
    margin: 0 auto;
  }

  .preview-card {
    background: linear-gradient(180deg, #1A1A1A 0%, #0F0F0F 100%);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 10px 14px;
    box-shadow: var(--shadow-md);
    position: sticky;
    top: 14px;
    overflow: hidden;
    max-height: calc(100vh - 120px);
    max-height: calc(100dvh - 120px);
  }
  .preview-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--orange) 100%);
  }
  .preview-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  .preview-title::before,
  .preview-title::after {
    content: "";
    height: 1px;
    background: var(--accent);
    flex: 1;
    opacity: 0.3;
  }
  
  #sandwich-canvas {
    width: 100%;
    max-width: 220px;
    height: auto;
    display: block;
    margin: 0 auto;
    image-rendering: -webkit-optimize-contrast;
  }

  /* ===== RESUMEN ===== */
  .summary-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px 16px;
    box-shadow: var(--shadow-sm);
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .summary-card h2 {
    margin: 0 0 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  #summary-list {
    list-style: none;
    margin: 0;
    padding: 0;
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #summary-list li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 0;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  #summary-list li:last-child { border-bottom: none; }
  #summary-list li .item-name {
    color: var(--text);
    font-weight: 500;
    font-size: 14px;
  }
  #summary-list li .item-price {
    color: var(--accent);
    font-weight: 700;
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
  }
  #summary-list .empty-msg {
    color: var(--text-muted);
    font-size: 13px;
    padding: 14px 0;
    text-align: center;
    font-style: italic;
  }
  .subtotal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    margin-top: 6px;
    border-top: 2px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .subtotal-row span:last-child {
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
  }

  /* ===== BOTÓN LIMPIAR ===== */
  .clear-btn {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    flex-shrink: 0;
  }
  .clear-btn:active { transform: scale(0.98); }

  /* ===== SECCIONES DE INGREDIENTES ===== */
  .col-ingredientes section {
    margin-bottom: 24px;
  }
  .col-ingredientes h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    font-weight: 400;
    margin: 0 0 12px;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .col-ingredientes h2::before {
    content: "";
    width: 5px;
    height: 20px;
    background: var(--accent);
    border-radius: 2px;
  }
  .col-ingredientes h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
  }

  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }

  /* ===== TARJETAS DE OPCIÓN ===== */
  .option {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
    padding: 10px 8px 12px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .option:has(input:checked) {
    border-color: var(--accent);
    background: linear-gradient(180deg, rgba(180, 255, 57, 0.08) 0%, var(--card) 100%);
  }
  .option:has(input:checked)::after {
    content: "✓";
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    background: var(--accent);
    color: #0F0F0F;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
  }
  .option input {
    position: absolute;
    opacity: 0;
    width: 1px; height: 1px;
  }
  .option-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    object-fit: cover;
    background: var(--bg-soft);
  }
  .option-name {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--text);
  }
  .price {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ===== CONTROLES DE CANTIDAD ===== */
  .qty-controls {
    display: none;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
    padding: 3px 5px;
    background: var(--bg);
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .qty-controls.visible { display: flex; }
  .qty-btn {
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #0F0F0F;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .qty-btn.qty-minus {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  .qty-display {
    min-width: 18px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ===== BARRA TOTAL ===== */
  .total-bar {
    background: rgba(15, 15, 15, 0.98);
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    position: relative;
    flex-shrink: 0;
  }
  .total-bar::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--orange) 100%);
  }
  .total-bar .label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .total-bar .amount {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
    margin-top: 3px;
  }
  .total-bar button {
    background: var(--accent);
    color: #0F0F0F;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ===== TOAST ===== */
  .toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }
  .toast {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    background: rgba(26, 26, 26, 0.98);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    border-left: 4px solid var(--accent);
    transform: translateX(120%);
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    pointer-events: auto;
    max-width: 320px;
  }
  .toast.toast-visible { transform: translateX(0); opacity: 1; }
  .toast.toast-hiding { transform: translateX(120%); opacity: 0; }
  .toast.toast-success { border-left-color: var(--accent); }
  .toast.toast-remove { border-left-color: var(--orange); }
  .toast.toast-info { border-left-color: #60A5FA; }
  .toast-icon {
    width: 24px;
    height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 900;
    color: #0F0F0F;
    flex-shrink: 0;
  }
  .toast-success .toast-icon { background: var(--accent); }
  .toast-remove .toast-icon { background: var(--orange); color: white; }
  .toast-info .toast-icon { background: #60A5FA; color: white; }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 10000;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.active { display: flex; }
  .modal-content {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--card);
    z-index: 1;
  }
  .modal-header h2 {
    margin: 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .modal-close {
    background: transparent;
    border: 1px solid var(--border);
    font-size: 18px;
    cursor: pointer;
    color: var(--text-muted);
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-body { padding: 20px 24px; }
  .form-group {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-group label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .form-group input,
  .form-group select {
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .order-preview {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-top: 6px;
  }
  .order-preview h3 {
    margin: 0 0 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  #modal-summary-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 180px;
    overflow-y: auto;
  }
  #modal-summary-list li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 0;
    font-size: 14px;
    color: var(--text);
  }
  #modal-summary-list li .item-price {
    font-weight: 700;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
  }
  .modal-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    margin-top: 10px;
    border-top: 2px solid var(--border);
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }
  .modal-total span:last-child {
    color: var(--accent);
    font-size: 26px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
  }
  .modal-footer {
    display: flex;
    gap: 10px;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    position: sticky;
    bottom: 0;
    background: var(--card);
  }
  .modal-footer button {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: none;
  }
  .btn-secondary {
    background: transparent;
    border: 1.5px solid var(--border) !important;
    color: var(--text-muted);
  }
  .btn-primary {
    background: var(--accent);
    color: #0F0F0F;
  }
</style>
</head>
<body class="con-fondo">

<header>
  <h1>ARMA TU <span>SÁNDWICH</span></h1>
  <p>Elige tus ingredientes y mira el total <em>al instante</em></p>
</header>

<div class="layout">

  <div class="col-ingredientes">
    <section>
      <h2>Pan</h2>
      <div id="pan-group" class="category-grid"></div>
    </section>

    <section>
      <h2>Salsas</h2>
      <div id="salsas-group" class="category-grid"></div>
    </section>

    <section>
      <h2>Embutidos</h2>
      <div id="embutidos-group" class="category-grid"></div>
    </section>

    <section>
      <h2>Proteínas</h2>
      <div id="proteinas-group" class="category-grid"></div>
    </section>

    <section>
      <h2>Verduras</h2>
      <div id="verduras-group" class="category-grid"></div>
    </section>
  </div>

  <div class="col-resumen">
    <div class="summary-card">
      <h2>Resumen del pedido</h2>
      <ul id="summary-list"></ul>
      <div class="subtotal-row">
        <span>Subtotal</span>
        <span id="subtotal-out">$0.00</span>
      </div>
      <button id="clear-btn" class="clear-btn">🗑 Limpiar todo</button>
    </div>
  </div>

  <div class="col-sandwich">
    <div class="preview-card">
      <span class="preview-title">Así va tu sándwich</span>
      <canvas id="sandwich-canvas" width="220" height="440"></canvas>
    </div>
  </div>

</div>

<div class="total-bar">
  <div>
    <div class="label">Total</div>
    <div class="amount" id="total-out">$0.00</div>
  </div>
  <button onclick="openOrderModal()">Ordenar ahora</button>
</div>

<!-- ===== MODAL DE ORDENAR ===== -->
<div id="order-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Confirmar pedido</h2>
      <button id="modal-close" class="modal-close">✕</button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label for="client-name">Nombre del cliente</label>
        <input type="text" id="client-name" placeholder="Ej. Juan Pérez" autocomplete="name">
      </div>
      
      <div class="form-group">
        <label for="payment-method">Método de pago</label>
        <select id="payment-method">
          <option value="">Selecciona una opción...</option>
          <option value="Efectivo">💵 Efectivo</option>
          <option value="Tarjeta de crédito">💳 Tarjeta de crédito</option>
          <option value="Tarjeta de débito">💳 Tarjeta de débito</option>
          <option value="Transferencia">📱 Transferencia / SPEI</option>
          <option value="PayPal">🅿️ PayPal</option>
        </select>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="order-date">Fecha</label>
          <input type="date" id="order-date">
        </div>
        <div class="form-group">
          <label for="order-time">Hora</label>
          <input type="time" id="order-time">
        </div>
      </div>
      
      <div class="order-preview">
        <h3>Resumen del pedido</h3>
        <ul id="modal-summary-list"></ul>
        <div class="modal-total">
          <span>Total</span>
          <span id="modal-total">$0.00</span>
        </div>
      </div>
    </div>
    
    <div class="modal-footer">
      <button id="btn-cancel" class="btn-secondary">Cancelar</button>
      <button id="btn-print" class="btn-primary">🖨 Imprimir ticket</button>
    </div>
  </div>
</div>

<script src="ingredients.js"></script>
<script src="app.js"></script>
</body>
